services:
  database:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGPORT: ${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT in .env}
    command: ["postgres", "-p", "${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT in .env}"]
    ports:
      - "${POSTGRES_HOST_PORT:?Set POSTGRES_HOST_PORT in .env}:${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT in .env}"
    volumes:
      - axm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env} -p ${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT in .env}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_PORT: ${BACKEND_CONTAINER_PORT:?Set BACKEND_CONTAINER_PORT in .env}
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:?Set APP_ENV in .env}
      APP_PORT: ${BACKEND_CONTAINER_PORT:?Set BACKEND_CONTAINER_PORT in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
      POSTGRES_CONTAINER_PORT: ${POSTGRES_CONTAINER_PORT:?Set POSTGRES_CONTAINER_PORT in .env}
      TIMEZONE: ${TIMEZONE:?Set TIMEZONE in .env}
      ALLOWED_ORIGINS: "[\"${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}\"]"
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET in .env}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:?Set ADMIN_SESSION_TTL_SECONDS in .env}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:?Set ADMIN_COOKIE_SECURE in .env}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:?Set BACKEND_HOST_PORT in .env}:${BACKEND_CONTAINER_PORT:?Set BACKEND_CONTAINER_PORT in .env}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_CONTAINER_PORT:?Set BACKEND_CONTAINER_PORT in .env}/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT:?Set FRONTEND_CONTAINER_PORT in .env}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:?Set API_INTERNAL_URL in .env}
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT:?Set FRONTEND_CONTAINER_PORT in .env}
      NGINX_ENVSUBST_FILTER: ^(API_INTERNAL_URL|FRONTEND_CONTAINER_PORT)$
    ports:
      - "${FRONTEND_HOST_PORT:?Set FRONTEND_HOST_PORT in .env}:${FRONTEND_CONTAINER_PORT:?Set FRONTEND_CONTAINER_PORT in .env}"

  gps-simulator:
    profiles:
      - gps-simulation
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      [
        "python",
        "scripts/simulate_gps.py",
        "--api-url",
        "${API_INTERNAL_URL:?Set API_INTERNAL_URL in .env}",
        "--admin-key",
        "${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}",
        "--loop",
      ]
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:?Set API_INTERNAL_URL in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      TIMEZONE: ${TIMEZONE:?Set TIMEZONE in .env}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  axm_postgres_data:
