<header class="site-header">
  <div class="header-content">
    <a class="brand" routerLink="/" aria-label="Ir al inicio de Residuos AXM" (click)="closeMenu()">
      <img
        class="brand-logo"
        src="/images/logos/logo_axm_residuos.png"
        alt=""
        width="211"
        height="114"
      />
      <span class="brand-name">Residuos<br />AXM</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Abrir menú principal"
      aria-controls="main-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav
      id="main-navigation"
      class="main-navigation"
      aria-label="Navegación principal"
      [class.main-navigation--open]="menuOpen()"
    >
      <a routerLink="/rutas" (click)="closeMenu()">Rutas</a>
      <a href="#acerca-de" (click)="closeMenu()">Acerca de</a>
      <a routerLink="/contacto" (click)="closeMenu()">Contacto</a>
      <a routerLink="/ayuda" (click)="closeMenu()">Ayuda</a>
    </nav>
  </div>
</header>
