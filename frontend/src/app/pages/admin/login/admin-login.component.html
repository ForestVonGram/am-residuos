<main class="admin-access">
  <section class="admin-card" aria-labelledby="admin-login-title">
    <header class="admin-card__header">
      <div class="admin-brand">
        <img
          src="/images/logos/logo_axm_residuos.png"
          alt=""
          width="211"
          height="114"
        />
        <span>Residuos<br />AXM</span>
      </div>
      <p>Panel administrativo</p>
    </header>

    <div class="admin-card__body">
      <div class="login-heading">
        <p>Acceso administrativo</p>
        <h1 id="admin-login-title">Iniciar sesión</h1>
        <span>
          Ingresa tus credenciales administrativas.
        </span>
      </div>

      <form (ngSubmit)="submit()">
        <label for="admin-username">Usuario</label>
        <input
          id="admin-username"
          name="username"
          type="text"
          autocomplete="username"
          [(ngModel)]="username"
          required
        />

        <label for="admin-password">Contraseña</label>
        <input
          id="admin-password"
          name="password"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          required
        />

        @if (errorMessage()) {
          <p class="form-error" role="alert">{{ errorMessage() }}</p>
        }

        <button class="login-button" type="submit">Ingresar al panel</button>
      </form>

    </div>
  </section>
</main>
